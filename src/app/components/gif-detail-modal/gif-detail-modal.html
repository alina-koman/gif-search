<dialog
  #dialog
  class="gif-dialog overflow-hidden rounded-3xl border border-white/10 bg-[#18171d] p-0 text-white shadow-2xl"
  aria-labelledby="gif-detail-title"
  (click)="closeOnBackdrop($event)"
  (close)="onDialogClosed()"
>
  <div class="grid h-full md:grid-cols-[1.15fr_0.85fr]">
    <div class="detail-preview relative grid min-h-0 place-items-center overflow-hidden bg-black/30 p-5">
      <img
        class="max-h-full w-full rounded-xl object-contain"
        [ngSrc]="gif().images.original.url"
        [width]="gif().images.original.width"
        [height]="gif().images.original.height"
        [alt]="gif().title"
      />
      <button
        class="detail-close absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-full bg-black/60 text-xl text-white hover:bg-black/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-fuchsia-300"
        type="button"
        aria-label="Закрити деталі GIF"
        autofocus
        (click)="close()"
      >
        ×
      </button>
    </div>
    <div class="flex min-h-0 flex-col overflow-y-auto p-6 sm:p-8">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-fuchsia-300">Деталі GIF</p>
      <h2 id="gif-detail-title" class="mt-3 text-2xl font-bold leading-tight">{{ gif().title }}</h2>

      @if (gif().user; as user) {
        <a
          class="mt-6 flex items-center gap-3 rounded-2xl border border-white/10 p-3 text-white no-underline transition hover:bg-white/5"
          [href]="user.profile_url"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="h-11 w-11 rounded-full object-cover"
            [ngSrc]="user.avatar_url"
            width="44"
            height="44"
            alt=""
          />
          <span class="min-w-0">
            <span class="block truncate text-sm font-semibold">{{ user.display_name }}</span>
            <span class="block truncate text-xs text-zinc-500">&#64;{{ user.username }}</span>
          </span>
          <span class="ml-auto text-zinc-500" aria-hidden="true">↗</span>
        </a>
      } @else {
        <p class="mt-6 text-sm text-zinc-500">Інформація про автора відсутня.</p>
      }

      <dl class="mt-6 grid grid-cols-2 gap-4 border-t border-white/10 pt-5">
        <div>
          <dt class="text-xs text-zinc-500">Рейтинг</dt>
          <dd class="mt-1 text-sm font-medium uppercase">{{ gif().rating }}</dd>
        </div>
        <div>
          <dt class="text-xs text-zinc-500">Додано</dt>
          <dd class="mt-1 text-sm font-medium">{{ gif().import_datetime | date: 'mediumDate' }}</dd>
        </div>
      </dl>

      <div class="mt-auto grid grid-cols-2 gap-3 pt-6">
        <button
          class="action-button rounded-xl border border-white/10 px-3 py-3 text-sm font-semibold text-white transition hover:bg-white/8 focus-visible:outline focus-visible:outline-2 focus-visible:outline-fuchsia-300 disabled:cursor-wait disabled:opacity-60"
          type="button"
          [disabled]="activeAction() !== null"
          (click)="copyLink()"
        >
          {{ activeAction() === 'copy' ? 'Копіюємо…' : 'Копіювати посилання' }}
        </button>
        <button
          class="action-button rounded-xl bg-gradient-to-r from-fuchsia-600 to-violet-600 px-3 py-3 text-sm font-semibold text-white transition hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-fuchsia-300 disabled:cursor-wait disabled:opacity-60"
          type="button"
          [disabled]="activeAction() !== null"
          (click)="download()"
        >
          {{ activeAction() === 'download' ? 'Завантажуємо…' : 'Завантажити GIF' }}
        </button>
      </div>
      <p class="mt-3 min-h-5 text-xs text-zinc-400" role="status" aria-live="polite">
        {{ actionMessage() }}
      </p>

      <a
        class="mt-3 inline-flex items-center justify-center gap-2 rounded-xl bg-white/8 px-4 py-3 text-sm font-semibold text-white no-underline transition hover:bg-white/12 focus-visible:outline focus-visible:outline-2 focus-visible:outline-fuchsia-300"
        [href]="gif().url"
        target="_blank"
        rel="noopener noreferrer"
      >
        Переглянути на GIPHY <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
</dialog>
